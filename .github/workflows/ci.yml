name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y socat openssh-server

      - name: Set up localhost SSH (key-based)
        if: runner.os == 'Linux'
        run: |
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N ""
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no 127.0.0.1 echo "SSH OK"

      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run Linux tests
        if: runner.os == 'Linux'
        run: python -m pytest tests/ -v --timeout=60

      - name: Run Windows-compatible tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m pytest tests/ -v --timeout=60
